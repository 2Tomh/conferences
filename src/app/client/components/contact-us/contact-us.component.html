<div class="contact-page" dir="ltr">

  <!-- Hero -->
  <div class="contact-hero">
    <span class="contact-eyebrow">Mind-IL</span>
    <h1>Get in Touch</h1>
    <p class="contact-hero-sub">Have a question about a payment or a charge from your conference registration? Reach out below.</p>
  </div>

  <!-- Card -->
  <div class="contact-cards">
    <div class="contact-card highlight">
      <div class="contact-icon">💳</div>
      <span class="contact-tag">Payment Provider</span>
      <h3>{{ paymentContact.title }}</h3>
      <p>{{ paymentContact.description }}</p>
      <a class="contact-email-btn"
         [href]="gmailComposeLink(paymentContact.email)"
         target="_blank"
         rel="noopener">
        {{ paymentContact.email }}
      </a>
    </div>
  </div>

  <!-- Bottom note -->
  <div class="contact-footnote">
    <p>We typically respond within 1–2 business days.</p>
  </div>

</div>
